name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push to an open pull request's branch fires both `push` and `pull_request`
# for the same commit, so without this the two runs compete for the same
# limited runner pool (seen 24-10-2026: duplicate runs, one stuck for
# minutes). `push` is now main only, so a feature branch gets one run (from
# `pull_request`); this group also cancels a superseded run if one is ever
# triggered twice for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned by full commit SHA (checked with gh api); tag in comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      # npm test runs vitest and then the airport-literal check
      - run: npm test
      - run: npm run check-literals
      - run: npm run build
      - run: npm audit --audit-level=high
